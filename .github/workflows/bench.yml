name: Real-model benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/core/**', 'src/worker/**', 'tests/bench/**', 'tests/fixtures/**', 'public/samples/bench/**']

permissions:
  contents: write

concurrency:
  group: repo-bot-commit
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci   # onnxruntime-node の取得のため scripts を有効にする
      - uses: actions/cache@v4
        with:
          path: node_modules/@huggingface/transformers/.cache
          key: hf-models-v1
      - run: node tests/bench/run-node.mjs
      - name: Commit results
        run: |
          git config user.name "radio-lingua-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/benchmarks
          git diff --cached --quiet && exit 0
          git commit -m "実モデル精度測定の結果を更新"
          git pull --rebase origin main
          git push origin HEAD:main
