name: Generate demo audio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/demo-audio/**']

permissions:
  contents: write

concurrency:
  group: repo-bot-commit
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg
      - run: pip install kokoro soundfile
      - run: python scripts/demo-audio/kokoro_gen.py scripts/demo-audio/lines.json scripts/demo-audio/out
      - run: scripts/demo-audio/build.sh
      - name: Commit generated audio
        run: |
          git config user.name "radio-lingua-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/samples/demo-dispatch.mp3 tests/fixtures/demo-dispatch.wav
          git diff --cached --quiet && exit 0
          git commit -m "デモ音声を再生成（Kokoro）"
          git pull --rebase origin main
          git push origin HEAD:main
